spring.application.name=klyn
spring.datasource.url=jdbc:mysql://localhost:3306/klyn
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

alpha.vantage.api-key=${ALPHA_VANTAGE_API_KEY}
alpha.vantage.base-url=https://www.alphavantage.co/query
alpha.vantage.connect-timeout-ms=5000
alpha.vantage.response-timeout-ms=10000
alpha.vantage.output-size=compact

market-data.batch.max-requests-per-run=5
market-data.batch.delay-between-requests-ms=12000

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}